# Runs the examples against the mock Teak API, with test keys, so tests need no real keys.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --wait checkout-node
x-test-env: &test-env
  TEAK_API_BASE: http://mock-teak:4010/v1
  TEAK_PUBLIC_KEY: pk_test_mock
  TEAK_SECRET_KEY: sk_test_mock
  TEAK_WEBHOOK_SECRET: so-secret

services:
  mock-teak:
    build: ./tests/mock-teak
    ports: ["4010:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      retries: 10

  checkout-node:
    environment: *test-env
    depends_on: { mock-teak: { condition: service_healthy } }
  checkout-python:
    environment: *test-env
    depends_on: { mock-teak: { condition: service_healthy } }
  webhooks-node:
    environment: *test-env
  webhooks-python:
    environment: *test-env
